<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Overhead - Treasure Hunt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="1024" height="768" aria-label="Treasure Hunt game"></canvas>

    <div id="startOverlay" class="overlay">
      <div class="overlay-card">
        <h1>Treasure Hunt</h1>
        <p>Find keys, unlock the doors, and reach the treasure.</p>
        <p class="controls"><strong>Move:</strong> WASD / Arrow Keys<br><strong>Zoom:</strong> Hold V</p>
        <button id="startButton" type="button">Play</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
